<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Reviews</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --card-border: #334155;
            --input-bg: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .back-link {
            position: absolute;
            left: 2rem;
            top: 2.5rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-hover);
        }

        main {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            display: grid;
            gap: 2rem;
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.5rem;
            color: var(--text-color);
        }

        .review-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input, textarea, select {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .review-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .review-item {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .review-author {
            font-weight: 600;
            color: var(--accent-hover);
            font-size: 1.1rem;
        }

        .review-rating {
            color: #fbbf24;
            letter-spacing: 2px;
        }

        .review-comment {
            line-height: 1.6;
            margin: 0;
            color: var(--text-color);
        }
        
        .empty-state {
            text-align: center;
            color: #94a3b8;
            padding: 2rem;
            font-style: italic;
        }

        .delete-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.75rem;
            align-self: flex-end;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-link">← Back to Games</a>
        <h1 id="page-title">Loading Game...</h1>
    </header>

    <main>
        <!-- Review Submission Card -->
        <div class="section-card">
            <h2>Write a Review</h2>
            <form id="review-form" class="review-form">
                <input type="text" id="username" placeholder="Your Name" required>
                <select id="rating" required>
                    <option value="" disabled selected>Select a Rating...</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                    <option value="3">⭐⭐⭐ (3/5)</option>
                    <option value="2">⭐⭐ (2/5)</option>
                    <option value="1">⭐ (1/5)</option>
                </select>
                <textarea id="comment" placeholder="Share your thoughts!" rows="4" required></textarea>
                <button type="submit">Post Review</button>
            </form>
        </div>

        <!-- Reviews List Card -->
        <div class="section-card">
            <h2>Community Reviews</h2>
            <div id="reviews-container" class="review-list">
                <div class="empty-state">Loading reviews...</div>
            </div>
        </div>
    </main>

    <script>
        // Extract Game ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        if (!gameId) {
            document.getElementById('page-title').textContent = "Game Not Found";
            document.getElementById('reviews-container').innerHTML = "<div class='empty-state'>Invalid Game ID. Go back to the homepage.</div>";
            document.getElementById('review-form').style.display = 'none';
        } else {
            // Load Game Data
            fetch(`http://localhost:3000/games/${gameId}`)
                .then(res => res.json())
                .then(game => {
                    if (game.error) throw new Error(game.error);
                    document.getElementById('page-title').textContent = game.name + " Reviews";
                })
                .catch(err => {
                    document.getElementById('page-title').textContent = "Unknown Game";
                    console.error("Error loading game:", err);
                });

            // Load Reviews
            function loadReviews() {
                fetch(`http://localhost:3000/games/${gameId}/reviews`)
                    .then(res => res.json())
                    .then(reviews => {
                        const container = document.getElementById('reviews-container');
                        container.innerHTML = "";

                        if (!reviews || reviews.length === 0) {
                            container.innerHTML = "<div class='empty-state'>No reviews yet. Be the first!</div>";
                            return;
                        }

                        reviews.forEach(review => {
                            // The server sends created_at. Fallback string if invalid.
                            let dateStr = "Unknown Date";
                            if (review.created_at) {
                                // Sometimes sqlite returns "2026-03-22 18:24:23", which JS 'Date' can parse or needs 'T' replacing ' '
                                const dateObj = new Date(review.created_at.replace(' ', 'T'));
                                if (!isNaN(dateObj)) dateStr = dateObj.toLocaleDateString();
                            }
                            
                            const div = document.createElement("div");
                            div.className = "review-item";
                            div.innerHTML = `
                                <div class="review-header">
                                    <span class="review-author">${review.username}</span>
                                    <span>
                                        <span class="review-rating">${"⭐".repeat(review.rating)}</span>
                                        <span style="margin-left:8px; display:inline-block">${dateStr}</span>
                                    </span>
                                </div>
                                <p class="review-comment">${review.comment}</p>
                                <button class="delete-btn" onclick="deleteReview(${review.id})">🗑 Delete</button>
                            `;
                            container.appendChild(div);
                        });
                    })
                    .catch(err => {
                        console.error("Error loading reviews:", err);
                        document.getElementById('reviews-container').innerHTML = "<div class='empty-state'>Failed to load reviews.</div>";
                    });
            }

            loadReviews();

            // Delete a review
            function deleteReview(reviewId) {
                if (!confirm('Are you sure you want to delete this review?')) return;
                fetch(`http://localhost:3000/reviews/${reviewId}`, { method: 'DELETE' })
                    .then(res => {
                        if (!res.ok) throw new Error('Failed to delete');
                        loadReviews();
                    })
                    .catch(err => {
                        console.error('Error deleting review:', err);
                        alert('Failed to delete review.');
                    });
            }

            // Handle Form Submit
            document.getElementById('review-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const submitBtn = this.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = "Posting...";

                const payload = {
                    game_id: parseInt(gameId, 10),
                    username: document.getElementById('username').value,
                    rating: parseInt(document.getElementById('rating').value, 10),
                    comment: document.getElementById('comment').value
                };

                fetch('http://localhost:3000/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => {
                    if (!res.ok) throw new Error("Failed to post review");
                    return res.json();
                })
                .then(data => {
                    // Reset form
                    document.getElementById('review-form').reset();
                    // Refetch reviews
                    loadReviews();
                })
                .catch(err => {
                    console.error("Error posting review:", err);
                    alert("An error occurred while posting your review.");
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Post Review";
                });
            });
        }
    </script>
</body>
</html>
